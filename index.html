<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数表メーカー</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root {
  --bg:#f4f6f9; --surface:#fff; --border:#e2e8f0; --text:#1e293b; --muted:#64748b;
  --accent:#3b82f6; --accent2:#7c3aed; --row-even:#f8fafc; --row-odd:#fff;
  --row-hover:#eff6ff; --num-pos:#1d4ed8; --num-neg:#dc2626;
  --shadow:0 4px 24px rgba(0,0,0,.08);
}
[data-theme=dark] {
  --bg:#0f172a; --surface:#1e293b; --border:#334155; --text:#e2e8f0; --muted:#94a3b8;
  --accent:#60a5fa; --accent2:#a78bfa; --row-even:#1a2740; --row-odd:#1e293b;
  --row-hover:#1e3a5f; --num-pos:#60a5fa; --num-neg:#f87171;
  --shadow:0 4px 24px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Hiragino Sans','Noto Sans JP','Segoe UI',sans-serif;min-height:100vh;transition:background .3s,color .3s}

/* HEADER */
.app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);position:sticky;top:0;z-index:100}
.app-title{font-size:1.05rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-actions{display:flex;gap:6px;align-items:center}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:7px;font-size:.8rem;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--text);transition:all .2s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9;color:#fff}
.btn-ghost{border-color:transparent}
.btn-ghost:hover{background:var(--row-hover);border-color:var(--border);color:var(--text)}

/* LAYOUT */
.layout{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 54px)}

/* SIDEBAR */
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;max-height:calc(100vh - 54px);position:sticky;top:54px}
.sec-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}

/* INPUT AREA */
.input-area{border:2px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .2s,box-shadow .2s;background:var(--surface)}
.input-area:focus-within,.input-area.drag-over{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.input-area-top{padding:8px 12px 6px;background:var(--row-even);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.input-label{font-size:.78rem;font-weight:700;color:var(--accent)}
.data-textarea{width:100%;min-height:160px;padding:10px 12px;border:none;outline:none;background:var(--surface);color:var(--text);font-size:.8rem;font-family:'Menlo','Consolas',monospace;resize:vertical;display:block;line-height:1.5}
.input-footer{padding:5px 10px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--row-even)}
.parse-hint{font-size:.72rem;color:var(--muted);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.parse-badge{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--accent);color:#fff;flex-shrink:0;margin-right:6px;display:none}

/* SETTINGS */
.settings-grid{display:flex;flex-direction:column;gap:10px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.setting-label{font-size:.82rem;color:var(--text);flex:1}
.setting-label small{display:block;font-size:.7rem;color:var(--muted)}
select,input[type=text]{padding:5px 9px;border-radius:6px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:.8rem;outline:none;transition:border-color .2s;cursor:pointer}
select:focus,input[type=text]:focus{border-color:var(--accent)}
.toggle{position:relative;width:36px;height:20px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:999px;transition:.3s}
.toggle-slider::before{content:'';position:absolute;width:14px;height:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle input:checked+.toggle-slider{background:var(--accent)}
.toggle input:checked+.toggle-slider::before{transform:translateX(16px)}

/* SCHEME */
.scheme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.scheme-chip{border-radius:7px;height:36px;cursor:pointer;border:2.5px solid transparent;transition:all .2s;overflow:hidden;display:flex}
.scheme-chip.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,130,246,.3)}
.scheme-chip div{flex:1}

/* MAIN */
.main{padding:20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar-sep{width:1px;height:22px;background:var(--border);margin:0 2px}
.title-input{font-size:1.05rem;font-weight:700;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--text);outline:none;padding:2px 4px;transition:border-color .2s;min-width:180px}
.title-input:focus{border-color:var(--accent)}
.title-input::placeholder{color:var(--muted);font-weight:400}

/* TABLE CONTAINER */
#table-container{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--border)}
.table-title-bar{padding:14px 20px 10px;border-bottom:1px solid var(--border)}
.table-title{font-size:1rem;font-weight:700;color:var(--text)}
.table-subtitle{font-size:.76rem;color:var(--muted);margin-top:2px}
.table-scroll{overflow-x:auto}

table{width:100%;border-collapse:collapse}

/* THEMES */
.theme-blue thead tr{background:#1e3a5f}
.theme-blue thead th{color:#bfdbfe}
.theme-blue tbody tr:hover{background:#eff6ff!important}
[data-theme=dark] .theme-blue tbody tr:hover{background:#1e3a5f!important}
.theme-slate thead tr{background:#334155}
.theme-slate thead th{color:#e2e8f0}
.theme-slate tbody tr:hover{background:#f1f5f9!important}
[data-theme=dark] .theme-slate tbody tr:hover{background:#334155!important}
.theme-purple thead tr{background:#4c1d95}
.theme-purple thead th{color:#ddd6fe}
.theme-purple tbody tr:hover{background:#f5f3ff!important}
[data-theme=dark] .theme-purple tbody tr:hover{background:#2e1065!important}
.theme-green thead tr{background:#14532d}
.theme-green thead th{color:#bbf7d0}
.theme-green tbody tr:hover{background:#f0fdf4!important}
[data-theme=dark] .theme-green tbody tr:hover{background:#14532d!important}
.theme-warm thead tr{background:#7c2d12}
.theme-warm thead th{color:#fed7aa}
.theme-warm tbody tr:hover{background:#fff7ed!important}
[data-theme=dark] .theme-warm tbody tr:hover{background:#7c2d12!important}
.theme-mono thead tr{background:#111827}
.theme-mono thead th{color:#f9fafb}
.theme-mono tbody tr:hover{background:#f9fafb!important}
[data-theme=dark] .theme-mono tbody tr:hover{background:#374151!important}

thead th{padding:11px 14px;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-align:left;white-space:nowrap;user-select:none;cursor:pointer}
thead th.num{text-align:right}
thead th .si{opacity:.4;margin-left:3px;font-size:.75em}
thead th.sorted .si{opacity:1}
tbody td{padding:9px 14px;font-size:.85rem;border-bottom:1px solid var(--border);vertical-align:middle;transition:background .1s}
tbody tr:last-child td{border-bottom:none}
tbody tr:nth-child(even){background:var(--row-even)}
tbody tr:nth-child(odd){background:var(--row-odd)}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:'Menlo','Consolas',monospace;color:var(--num-pos)}
td.num.neg{color:var(--num-neg)}
td.num.zero{color:var(--muted)}
td.row-idx{color:var(--muted);font-size:.73rem;font-variant-numeric:tabular-nums;text-align:right;padding-right:6px;width:36px;background:var(--row-even)!important;border-right:1px solid var(--border)}
td.heat{position:relative}
td.heat .bar{position:absolute;left:0;top:0;bottom:0;background:rgba(59,130,246,.1);z-index:0;transition:width .3s}
td.heat .cv{position:relative;z-index:1}
.total-row{font-weight:700;background:var(--row-even)!important;border-top:2px solid var(--border)!important}
.table-footer{padding:9px 20px;border-top:1px solid var(--border);background:var(--row-even);display:flex;gap:20px;font-size:.76rem;color:var(--muted);flex-wrap:wrap;align-items:center}
.table-footer strong{color:var(--text)}

/* MULTI-SECTION */
.report-title-bar{padding:14px 20px 10px;border-bottom:1px solid var(--border)}
.report-title{font-size:1.1rem;font-weight:800;color:var(--text)}
.report-sub{font-size:.78rem;color:var(--muted);margin-top:3px}
.section-wrap{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--border)}
.section-wrap+.section-wrap{margin-top:16px}
.section-title-bar{padding:10px 20px 8px;border-bottom:1px solid var(--border);background:var(--row-even);display:flex;align-items:center;justify-content:space-between}
.section-title{font-size:.88rem;font-weight:700;color:var(--text)}
.section-badge{font-size:.7rem;padding:2px 8px;border-radius:999px;border:1.5px solid var(--border);color:var(--muted)}

/* EMPTY */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 20px;color:var(--muted);text-align:center;gap:10px}
.empty-icon{font-size:3rem;opacity:.25}
.empty-title{font-size:.95rem;font-weight:600}
.empty-hint{font-size:.81rem;line-height:1.7;max-width:300px}

/* TOAST */
.toast{position:fixed;bottom:22px;right:22px;background:#1e293b;color:#f1f5f9;padding:10px 18px;border-radius:9px;font-size:.83rem;font-weight:600;box-shadow:0 8px 32px rgba(0,0,0,.3);transform:translateY(70px);opacity:0;transition:all .3s;z-index:999}
.toast.show{transform:translateY(0);opacity:1}

/* OCR OVERLAY */
.ocr-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,26,.75);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:14px;backdrop-filter:blur(4px)}
.ocr-overlay.show{display:flex}
.ocr-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px 36px;text-align:center;min-width:260px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.ocr-spinner{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.ocr-title{font-weight:700;color:var(--text);margin-bottom:5px}
.ocr-prog{font-size:.8rem;color:var(--muted)}
.ocr-bar-w{height:4px;background:var(--border);border-radius:9px;margin-top:10px;overflow:hidden}
.ocr-bar{height:100%;background:var(--accent);border-radius:9px;transition:width .3s;width:0%}

@media print{.app-header,.sidebar,.toolbar{display:none!important}.main{padding:0}#table-container{box-shadow:none;border-radius:0}}
@media(max-width:768px){.layout{grid-template-columns:1fr}.sidebar{max-height:none;position:static}}
</style>
</head>
<body>

<header class="app-header">
  <div class="app-title">📊 数表メーカー</div>
  <div class="header-actions">
    <button class="btn btn-ghost" onclick="toggleTheme()" id="theme-btn">🌙 ダーク</button>
    <button class="btn" onclick="printTable()">🖨 印刷</button>
    <button class="btn" onclick="copyImage()">📷 画像コピー</button>
    <button class="btn btn-primary" onclick="downloadImage()">⬇ PNG保存</button>
  </div>
</header>

<div class="layout">
  <div class="sidebar">

    <!-- INPUT -->
    <div>
      <div class="sec-label">データ入力</div>
      <div class="input-area" id="input-area">
        <div class="input-area-top">
          <span class="input-label">📋 ここにデータを貼り付け</span>
          <span style="font-size:.7rem;color:var(--muted)">Cmd+V / Ctrl+V</span>
        </div>
        <textarea class="data-textarea" id="raw-input"
          placeholder="Excel・スプレッドシート・CSV・TSV・&#10;スペース区切りテキスト・スクリーンショット&#10;&#10;どこに貼り付けても自動的にここに入ります"
          oninput="onTextChange()"
          onpaste="onRawPaste(event)"></textarea>
        <div class="input-footer">
          <span class="parse-badge" id="parse-badge"></span>
          <span class="parse-hint" id="parse-hint">データを貼り付けてください</span>
          <button class="btn btn-ghost" style="padding:2px 8px;font-size:.7rem;flex-shrink:0" onclick="clearAll()">クリア</button>
        </div>
      </div>
    </div>

    <!-- SETTINGS -->
    <div>
      <div class="sec-label">表のスタイル</div>
      <div class="settings-grid">

        <div>
          <div class="sec-label" style="margin-bottom:5px">カラーテーマ</div>
          <div class="scheme-grid" id="scheme-grid">
            <div class="scheme-chip active" data-s="blue" onclick="setScheme('blue')" title="ブルー">
              <div style="background:#1e3a5f"></div><div style="background:#eff6ff"></div><div style="background:#bfdbfe"></div>
            </div>
            <div class="scheme-chip" data-s="slate" onclick="setScheme('slate')" title="スレート">
              <div style="background:#334155"></div><div style="background:#f1f5f9"></div><div style="background:#94a3b8"></div>
            </div>
            <div class="scheme-chip" data-s="purple" onclick="setScheme('purple')" title="パープル">
              <div style="background:#4c1d95"></div><div style="background:#f5f3ff"></div><div style="background:#ddd6fe"></div>
            </div>
            <div class="scheme-chip" data-s="green" onclick="setScheme('green')" title="グリーン">
              <div style="background:#14532d"></div><div style="background:#f0fdf4"></div><div style="background:#bbf7d0"></div>
            </div>
            <div class="scheme-chip" data-s="warm" onclick="setScheme('warm')" title="ウォーム">
              <div style="background:#7c2d12"></div><div style="background:#fff7ed"></div><div style="background:#fed7aa"></div>
            </div>
            <div class="scheme-chip" data-s="mono" onclick="setScheme('mono')" title="モノクロ">
              <div style="background:#111827"></div><div style="background:#f9fafb"></div><div style="background:#6b7280"></div>
            </div>
          </div>
        </div>

        <div class="setting-row">
          <label class="setting-label">
            区切り文字（手動）
            <small>自動がうまくいかない時</small>
          </label>
          <select id="delim-sel" onchange="onTextChange()">
            <option value="auto">自動</option>
            <option value="tab">タブ</option>
            <option value="comma">カンマ</option>
            <option value="space">スペース</option>
            <option value="pipe">| パイプ</option>
            <option value="semi">; セミコロン</option>
          </select>
        </div>

        <div class="setting-row">
          <label class="setting-label">行番号を表示</label>
          <label class="toggle"><input type="checkbox" id="tog-rownum" onchange="render()"><span class="toggle-slider"></span></label>
        </div>
        <div class="setting-row">
          <label class="setting-label">数値カラーバー<small>棒グラフ背景</small></label>
          <label class="toggle"><input type="checkbox" id="tog-heat" onchange="render()"><span class="toggle-slider"></span></label>
        </div>
        <div class="setting-row">
          <label class="setting-label">合計行を追加</label>
          <label class="toggle"><input type="checkbox" id="tog-total" onchange="render()"><span class="toggle-slider"></span></label>
        </div>
        <div class="setting-row">
          <label class="setting-label">サマリーを表示</label>
          <label class="toggle"><input type="checkbox" id="tog-summary" checked onchange="render()"><span class="toggle-slider"></span></label>
        </div>
        <div class="setting-row">
          <label class="setting-label">数値フォーマット</label>
          <select id="num-fmt" onchange="render()">
            <option value="auto">自動</option>
            <option value="comma">カンマ区切り</option>
            <option value="pct">%表示</option>
            <option value="raw">そのまま</option>
          </select>
        </div>
        <div class="setting-row">
          <label class="setting-label">サブタイトル</label>
          <input type="text" id="subtitle-inp" placeholder="（任意）" style="width:140px" oninput="render()">
        </div>

      </div>
    </div>

    <!-- SAMPLES -->
    <div>
      <div class="sec-label">サンプルデータ</div>
      <div style="display:flex;flex-direction:column;gap:5px">
        <button class="btn" style="justify-content:flex-start" onclick="loadSample('sales')">📈 売上表（月別）</button>
        <button class="btn" style="justify-content:flex-start" onclick="loadSample('kpi')">📊 KPI一覧</button>
        <button class="btn" style="justify-content:flex-start" onclick="loadSample('compare')">🔄 前年比較</button>
      </div>
    </div>

  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="toolbar">
      <input class="title-input" id="title-inp" placeholder="表のタイトルを入力..." oninput="render()" value="">
      <div class="toolbar-sep"></div>
      <button class="btn btn-ghost" id="sort-reset-btn" style="display:none" onclick="resetSort()">↺ ソート解除</button>
    </div>
    <div id="table-container">
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        <div class="empty-title">データを貼り付けてください</div>
        <div class="empty-hint">Excel・スプレッドシート・CSV・テキストをコピーして<br>Cmd+V（Mac）/ Ctrl+V（Windows）で貼り付けると<br>綺麗なレポート表に変換します</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="ocr-overlay" id="ocr-overlay">
  <div class="ocr-box">
    <div class="ocr-spinner"></div>
    <div class="ocr-title">画像を解析中...</div>
    <div class="ocr-prog" id="ocr-prog">初期化中</div>
    <div class="ocr-bar-w"><div class="ocr-bar" id="ocr-bar"></div></div>
  </div>
</div>

<script>
// ============================================================
//  STATE
// ============================================================
// allSections: [{title, headers, rows, colTypes, sortCol, sortAsc}]
let allSections = [];
let parsedData  = null;   // 後方互換（export等で参照）
let scheme      = 'blue';
let parseMethod = '';

// ============================================================
//  HTML TABLE PARSER  ― 複数テーブル対応
//  戻り値: [{title, rows}]  (rows = [header行, ...データ行])
// ============================================================
function parseHtmlTables(html) {
  let doc;
  try { doc = new DOMParser().parseFromString(html, 'text/html'); }
  catch(_) { const d=document.createElement('div'); d.innerHTML=html; doc=d; }

  // トップレベルのテーブルのみ取得（ネスト内テーブルは除外）
  const allTbls = Array.from(doc.querySelectorAll('table'));
  const topTbls = allTbls.filter(t => {
    let p = t.parentElement;
    while(p){ if(p.tagName==='TABLE') return false; p=p.parentElement; }
    return true;
  });
  if(!topTbls.length) return null;

  const sections = [];
  for(const tbl of topTbls){
    // テーブル直前のテキストをセクションタイトルとして取得
    const title = getPrecText(tbl);
    const rows = extractRows(tbl);
    if(rows && rows.length >= 2 && rows[0].length >= 2) sections.push({title, rows});
  }
  return sections.length ? sections : null;
}

function extractRows(tbl){
  const rows=[];
  tbl.querySelectorAll('tr').forEach(tr=>{
    const cells=[];
    tr.querySelectorAll('td,th').forEach(td=>{
      cells.push((td.textContent||'').replace(/\s+/g,' ').trim());
    });
    if(cells.some(c=>c!=='')) rows.push(cells);
  });
  return rows.length ? rows : null;
}

function getPrecText(el){
  // 直前の兄弟要素または親のテキストを最大60文字取得
  let node = el.previousSibling;
  while(node){
    const t=(node.textContent||'').trim().replace(/\s+/g,' ');
    if(t.length>1) return t.slice(0,80);
    node=node.previousSibling;
  }
  return '';
}

// ============================================================
//  TEXT PARSER  (TSV / CSV / Markdown / Fixed-width / Space)
// ============================================================
function csvSplit(line) {
  const r=[]; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){inQ=!inQ;continue}
    if(ch===','&&!inQ){r.push(cur.trim());cur=''}
    else cur+=ch;
  }
  r.push(cur.trim());
  return r;
}

function pipeSplit(line) {
  const c = line.split('|').map(s=>s.trim());
  if(c[0]==='') c.shift();
  if(c[c.length-1]==='') c.pop();
  return c;
}

function scoreRows(rows) {
  if(!rows.length) return 0;
  const counts = rows.map(r=>r.length);
  const med = [...counts].sort((a,b)=>a-b)[Math.floor(counts.length/2)];
  if(med<=1) return 0;
  const cons = counts.filter(c=>Math.abs(c-med)<=1).length/counts.length;
  return med * cons;
}

function parseFixedWidth(lines) {
  if(lines.length<2) return null;
  const maxLen = Math.max(...lines.map(l=>l.length));
  const spFreq = new Array(maxLen).fill(0);
  for(const line of lines){
    for(let i=0;i<line.length;i++) if(line[i]===' ') spFreq[i]++;
    for(let i=line.length;i<maxLen;i++) spFreq[i]++;
  }
  const th = lines.length*0.65;
  const colStarts=[0];
  let inSp=spFreq[0]>=th;
  for(let i=1;i<maxLen;i++){
    const isSp=spFreq[i]>=th;
    if(!isSp&&inSp) colStarts.push(i);
    inSp=isSp;
  }
  if(colStarts.length<2) return null;
  return lines.map(line=>
    colStarts.map((s,idx)=>{
      const e=idx+1<colStarts.length?colStarts[idx+1]:line.length;
      return line.slice(s,Math.min(e,line.length)).trim();
    })
  );
}

// テキストを行リストに解析して {rows} を返す（単一テーブル）
function parseText(raw) {
  raw = raw.trim()
    .replace(/\r\n/g,'\n').replace(/\r/g,'\n')
    .replace(/[\u200B-\u200D\uFEFF]/g,'')
    .replace(/　/g,' ');
  if(!raw) return null;

  const lines = raw.split('\n').filter(l=>l.trim());
  if(!lines.length) return null;

  const manual = document.getElementById('delim-sel')?.value ?? 'auto';
  let rows;

  if(manual!=='auto'){
    const fns={tab:l=>l.split('\t').map(c=>c.trim()),comma:l=>csvSplit(l),
      space:l=>l.trim().split(/\s+/).filter(c=>c),pipe:l=>pipeSplit(l),semi:l=>l.split(';').map(c=>c.trim())};
    rows=lines.map(fns[manual]||(l=>[l]));
    parseMethod=manual;
  } else {
    const cands=[];
    const tR=lines.map(l=>l.split('\t').map(c=>c.trim()));
    cands.push({name:'TSV',rows:tR,score:scoreRows(tR)});
    const cR=lines.map(csvSplit);
    cands.push({name:'CSV',rows:cR,score:scoreRows(cR)});
    const sR=lines.map(l=>l.split(';').map(c=>c.trim()));
    cands.push({name:'セミコロン',rows:sR,score:scoreRows(sR)});
    if(lines.filter(l=>l.includes('|')).length>lines.length*.5){
      const pR=lines.filter(l=>!/^\|?[\s|:-]+\|/.test(l)).map(pipeSplit);
      cands.push({name:'Markdown',rows:pR,score:scoreRows(pR)});
    }
    const s2=lines.map(l=>l.trim().split(/\s{2,}/).map(c=>c.trim()).filter(c=>c));
    cands.push({name:'スペース',rows:s2,score:scoreRows(s2)});
    const s1=lines.map(l=>l.trim().split(/\s+/).filter(c=>c));
    cands.push({name:'スペース',rows:s1,score:scoreRows(s1)});
    const fw=parseFixedWidth(lines);
    if(fw) cands.push({name:'固定幅',rows:fw,score:scoreRows(fw)});
    const best=cands.reduce((a,b)=>b.score>a.score?b:a,cands[0]);
    rows=best.rows; parseMethod=best.name;
  }

  const med=[...rows.map(r=>r.length)].sort((a,b)=>a-b)[Math.floor(rows.length/2)];
  rows=rows.map(r=>{const c=[...r];while(c.length<med)c.push('');return c.slice(0,med)});
  const headers=rows[0];
  const dataRows=rows.slice(1);
  return{headers,rows:dataRows,colTypes:detectColTypes(headers,dataRows)};
}

// テキストを複数セクションに分割してパース
// 同じヘッダ行が繰り返される or ①②③ などの区切り文字で分割
function parseTextSections(raw) {
  raw = raw.trim()
    .replace(/\r\n/g,'\n').replace(/\r/g,'\n')
    .replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/　/g,' ');
  if(!raw) return null;

  const lines = raw.split('\n').filter(l=>l.trim());
  if(!lines.length) return null;

  // 単一テーブルとして解析
  const single = parseText(raw);
  if(!single || !single.rows.length) return null;

  const sections = [];

  // ヘッダ行を検出: 同じ列数でほぼ同じ内容の行が複数回現れる場合に分割
  const headerCandidate = single.headers.join('\t');
  const allRaw = [single.headers, ...single.rows];
  const headerIdxs = [];
  allRaw.forEach((row, i) => {
    if(i > 0 && row.join('\t') === headerCandidate) headerIdxs.push(i);
  });

  if(headerIdxs.length > 0) {
    // ヘッダが繰り返されている → 複数テーブルに分割
    const splits = [0, ...headerIdxs, allRaw.length];
    for(let i=0; i<splits.length-1; i++){
      const chunk = allRaw.slice(splits[i], splits[i+1]);
      if(chunk.length < 2) continue;
      const h=chunk[0], dr=chunk.slice(1);
      sections.push({title:'', rows:chunk, headers:h, dataRows:dr, colTypes:detectColTypes(h,dr), sortCol:-1, sortAsc:true});
    }
  } else {
    // ①②③ などでテキストが区切られているか試みる（TSVの場合はセクション行を検出）
    // → 単一テーブルとして返す
    sections.push({title:'', rows:[single.headers,...single.rows], headers:single.headers,
      dataRows:single.rows, colTypes:single.colTypes, sortCol:-1, sortAsc:true});
  }

  return sections.length ? sections : null;
}

function detectColTypes(headers,dataRows){
  return headers.map((_,ci)=>{
    const vals=dataRows.map(r=>r[ci]).filter(v=>v!=='');
    if(!vals.length) return 'text';
    const n=vals.filter(v=>{
      const c=v.replace(/,/g,'').replace(/%/,'').replace(/[+▲▼±]/g,'').trim();
      return c!==''&&!isNaN(parseFloat(c));
    }).length;
    return n/vals.length>.6?'num':'text';
  });
}

function toNum(s){
  if(!s) return null;
  const n=parseFloat(s.replace(/,/g,'').replace(/%/,''));
  return isNaN(n)?null:n;
}

function e(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ============================================================
//  RENDER  ― 全セクション描画
// ============================================================
function render(){
  if(!allSections.length) return;

  const showIdx  = document.getElementById('tog-rownum').checked;
  const showHeat = document.getElementById('tog-heat').checked;
  const showSum  = document.getElementById('tog-summary').checked;
  const showTot  = document.getElementById('tog-total').checked;
  const fmt      = document.getElementById('num-fmt').value;
  const mainTitle= document.getElementById('title-inp').value;
  const mainSub  = document.getElementById('subtitle-inp').value;
  const today    = new Date().toLocaleDateString('ja-JP');
  const multiSec = allSections.length > 1;

  function fmtNum(val,n){
    if(fmt==='comma'||(fmt==='auto'&&Math.abs(n)>=1000))
      return n.toLocaleString('ja-JP',{maximumFractionDigits:4});
    if(fmt==='pct') return (n*100).toFixed(1)+'%';
    if(val&&val.includes(',')) return n.toLocaleString('ja-JP');
    return val;
  }

  let outer = '';

  // レポートヘッダー（複数セクション時のみ or タイトル入力時）
  if(mainTitle||mainSub){
    outer += `<div class="report-title-bar">
      ${mainTitle?`<div class="report-title">${e(mainTitle)}</div>`:''}
      ${mainSub?`<div class="report-sub">${e(mainSub)}</div>`:''}
    </div>`;
  }

  allSections.forEach((sec, si) => {
    const{headers,dataRows,colTypes:ct}=sec;

    let dRows=[...dataRows];
    if(sec.sortCol>=0){
      dRows.sort((a,b)=>{
        const av=ct[sec.sortCol]==='num'?(toNum(a[sec.sortCol])??-Infinity):a[sec.sortCol];
        const bv=ct[sec.sortCol]==='num'?(toNum(b[sec.sortCol])??-Infinity):b[sec.sortCol];
        return sec.sortAsc?(av<bv?-1:av>bv?1:0):(av>bv?-1:av<bv?1:0);
      });
    }

    const colMM=headers.map((_,ci)=>{
      if(ct[ci]!=='num') return null;
      const v=dataRows.map(r=>toNum(r[ci])).filter(v=>v!==null);
      return v.length?{min:Math.min(...v),max:Math.max(...v)}:null;
    });

    const totals=showTot?headers.map((_,ci)=>{
      if(ct[ci]!=='num') return null;
      return dataRows.map(r=>toNum(r[ci])).filter(v=>v!==null).reduce((a,b)=>a+b,0);
    }):null;

    let h='';

    // セクションタイトル（複数セクション or タイトルあり時）
    if(multiSec || sec.title){
      const dispTitle = sec.title || `表 ${si+1}`;
      h+=`<div class="section-title-bar">
        <span class="section-title">${e(dispTitle)}</span>
        <span class="section-badge">${dRows.length}行 × ${headers.length}列</span>
      </div>`;
    } else if(!mainTitle && !mainSub){
      // 単一テーブルでタイトルなし → 従来の table-title-bar
    }

    h+=`<div class="table-scroll"><table class="theme-${scheme}"><thead><tr>`;
    if(showIdx) h+='<th></th>';
    headers.forEach((hdr,ci)=>{
      const isN=ct[ci]==='num';
      const isSorted=sec.sortCol===ci;
      h+=`<th class="${isN?'num':''} ${isSorted?'sorted':''}" onclick="doSort(${si},${ci})">
        ${e(hdr)}<span class="si">${isSorted?(sec.sortAsc?'↑':'↓'):'↕'}</span></th>`;
    });
    h+='</tr></thead><tbody>';

    dRows.forEach((row,ri)=>{
      h+='<tr>';
      if(showIdx) h+=`<td class="row-idx">${ri+1}</td>`;
      row.forEach((val,ci)=>{
        const n=ct[ci]==='num'?toNum(val):null;
        const isN=n!==null;
        let cls=isN?'num':'';
        if(isN){if(n<0)cls+=' neg';else if(n===0)cls+=' zero';}
        const disp=isN?fmtNum(val,n):val;
        if(showHeat&&isN&&colMM[ci]&&colMM[ci].max!==colMM[ci].min){
          const pct=Math.round((n-colMM[ci].min)/(colMM[ci].max-colMM[ci].min)*100);
          h+=`<td class="${cls} heat"><span class="bar" style="width:${pct}%"></span><span class="cv">${e(disp)}</span></td>`;
        } else {
          h+=`<td class="${cls}">${e(disp)}</td>`;
        }
      });
      h+='</tr>';
    });

    if(totals){
      h+='<tr class="total-row">';
      if(showIdx) h+='<td class="row-idx">計</td>';
      totals.forEach((t,ci)=>{
        if(t===null) h+=`<td style="color:var(--muted);font-size:.78rem">合計</td>`;
        else h+=`<td class="num">${t.toLocaleString('ja-JP',{maximumFractionDigits:4})}</td>`;
      });
      h+='</tr>';
    }

    h+='</tbody></table></div>';

    if(showSum){
      const numC=ct.filter(t=>t==='num').length;
      h+=`<div class="table-footer">
        <span><strong>${dRows.length}</strong> 行 × <strong>${headers.length}</strong> 列</span>
        <span>数値列: <strong>${numC}</strong></span>
        ${sec.sortCol>=0?`<span>ソート: <strong>${e(headers[sec.sortCol])}</strong></span>`:''}
        ${!multiSec?`<span style="margin-left:auto">作成日: ${today}</span>`:''}
      </div>`;
    }

    const wrap = multiSec ? `<div class="section-wrap">${h}</div>` : h;
    outer += wrap;
  });

  if(multiSec && showSum){
    const totalRows = allSections.reduce((s,sec)=>s+sec.dataRows.length,0);
    outer += `<div class="table-footer" style="background:var(--surface);border:1px solid var(--border);border-radius:0 0 14px 14px;margin-top:-1px">
      <span>合計 <strong>${allSections.length}</strong> テーブル / <strong>${totalRows}</strong> 行</span>
      <span style="margin-left:auto">作成日: ${today}</span>
    </div>`;
  }

  document.getElementById('table-container').innerHTML = outer;
}

// ============================================================
//  SORT  ― セクション単位
// ============================================================
function doSort(si, ci){
  const sec = allSections[si];
  if(!sec) return;
  if(sec.sortCol===ci){ if(sec.sortAsc){sec.sortAsc=false}else{sec.sortCol=-1;sec.sortAsc=true} }
  else{sec.sortCol=ci;sec.sortAsc=true}
  render();
}
function resetSort(){
  allSections.forEach(s=>{s.sortCol=-1;s.sortAsc=true;});
  document.getElementById('sort-reset-btn').style.display='none';
  render();
}

// ============================================================
//  SET PARSED DATA  (共通ヘルパー)
// ============================================================

// [{title, rows}] 形式から allSections を構築
function applySections(sections, method){
  if(!sections||!sections.length) return false;
  allSections = sections.map(sec=>{
    const rows = sec.rows || [sec.headers, ...(sec.dataRows||[])];
    const headers  = rows[0];
    const dataRows = rows.slice(1);
    const ct = sec.colTypes || detectColTypes(headers, dataRows);
    return {title: sec.title||'', headers, dataRows, colTypes:ct, sortCol:-1, sortAsc:true};
  });
  parsedData = {headers:allSections[0].headers, rows:allSections[0].dataRows}; // 後方互換
  parseMethod = method;
  document.getElementById('sort-reset-btn').style.display='none';
  const totalRows = allSections.reduce((s,sec)=>s+sec.dataRows.length,0);
  updateHint(totalRows, allSections[0].headers.length, method, allSections.length);
  render();
  return true;
}

function updateHint(numRows, numCols, method, numSections){
  const secLabel = numSections>1 ? `${numSections}テーブル / ` : '';
  document.getElementById('parse-hint').textContent=`${secLabel}${numRows}行 × ${numCols}列`;
  const badge=document.getElementById('parse-badge');
  badge.textContent=method;
  badge.style.display='inline';
}

// クリップボードから最善のデータを取得して適用する共通ロジック
async function processPaste(clipboardData) {
  const items = Array.from(clipboardData.items);

  // 1) 画像
  const img = items.find(it => it.type.startsWith('image/'));
  if (img) { await ocrImage(img.getAsFile()); return; }

  const html  = clipboardData.getData('text/html');
  const plain = clipboardData.getData('text/plain');

  // 2) HTML複数テーブルを試みる
  let htmlSections = null;
  if (html && html.includes('<table')) {
    htmlSections = parseHtmlTables(html);
    // 全テーブルの総行数
    if (htmlSections) {
      const totalHtmlRows = htmlSections.reduce((s,sec)=>s+sec.rows.length,0);
      // plain text の行数と比較し、大きく下回る場合はplainを使う
      const plainLines = (plain||'').split('\n').filter(l=>l.trim()).length;
      if (totalHtmlRows < plainLines * 0.7) htmlSections = null;
    }
  }

  if (htmlSections) {
    // TSV表現をテキストエリアに表示
    const tsvAll = htmlSections.map(s=>s.rows.map(r=>r.join('\t')).join('\n')).join('\n\n');
    document.getElementById('raw-input').value = tsvAll;
    applySections(htmlSections, 'HTMLテーブル');
    const total = htmlSections.reduce((s,sec)=>s+sec.rows.length-1, 0);
    showToast(`${htmlSections.length}テーブル / ${total}行 を取り込みました ✓`);
    return;
  }

  // 3) プレーンテキスト
  if (plain && plain.trim()) {
    document.getElementById('raw-input').value = plain;
    const secs = parseTextSections(plain);
    if (secs) {
      applySections(secs, parseMethod);
      const total = secs.reduce((s,sec)=>s+sec.dataRows.length, 0);
      showToast(`${secs.length>1?secs.length+'テーブル / ':''}${total}行 を取り込みました ✓`);
    }
    return;
  }

  if (plain) { document.getElementById('raw-input').value = plain; onTextChange(); }
}

// テキストエリアのペースト
async function onRawPaste(e) {
  e.preventDefault();
  await processPaste(e.clipboardData);
}

// ページ全体のペースト（テキストエリア以外にフォーカスがある時）
document.addEventListener('paste', async e => {
  const ta = document.getElementById('raw-input');
  // 画像は常にキャプチャ
  const img = Array.from(e.clipboardData.items).find(it => it.type.startsWith('image/'));
  if (img) { e.preventDefault(); await ocrImage(img.getAsFile()); return; }
  // テキストエリア/input にフォーカスがある場合は onRawPaste に任せる
  if (e.target === ta || e.target.tagName === 'INPUT') return;
  e.preventDefault();
  ta.focus();
  await processPaste(e.clipboardData);
});

// テキストエリアへの手入力
function onTextChange(){
  const val=document.getElementById('raw-input').value;
  if(!val.trim()){ clearAll(); return; }
  const secs=parseTextSections(val);
  if(!secs){
    document.getElementById('parse-hint').textContent='解析できませんでした';
    document.getElementById('parse-badge').style.display='none';
    return;
  }
  applySections(secs, parseMethod);
}

  document.getElementById('raw-input').value='';
  document.getElementById('parse-hint').textContent='データを貼り付けてください';
  document.getElementById('parse-badge').style.display='none';

    <div class="empty-hint">Excel・スプレッドシート・CSV・テキストをコピーして<br>Cmd+V（Mac）/ Ctrl+V（Windows）で貼り付けると<br>綺麗なレポート表に変換します</div>

// ============================================================
//  OCR  (Tesseract - 単語座標ベース再構成)
// ============================================================
async function ocrImage(blob){
  const ov=document.getElementById('ocr-overlay');
  const pg=document.getElementById('ocr-prog');
  const bar=document.getElementById('ocr-bar');
  ov.classList.add('show');
  try{
    const worker=await Tesseract.createWorker('jpn+eng',1,{
      logger:m=>{
        if(m.status==='recognizing text'){
          const p=Math.round((m.progress||0)*100);
          bar.style.width=p+'%';
          pg.textContent=`テキスト認識中... ${p}%`;
        }else{ pg.textContent=m.status; }
      }
    });
    await worker.setParameters({tessedit_pageseg_mode:'6'});
    const{data}=await worker.recognize(blob);
    await worker.terminate();

    const tsv=wordsToTsv(data.words);
    const ta=document.getElementById('raw-input');
    ta.value=tsv;
    const secs=parseTextSections(tsv);
    if(secs){ applySections(secs,'OCR'); }
    showToast('OCR完了 ✓');
  }catch(err){
    console.error(err);showToast('OCR失敗: '+err.message);
  }finally{ ov.classList.remove('show'); }
}

// 単語の座標情報からTSVを再構成
function wordsToTsv(words){
  if(!words||!words.length) return '';
  const ws=words.filter(w=>w.confidence>30&&w.text.trim()!=='');
  if(!ws.length) return '';
  ws.sort((a,b)=>a.bbox.y0-b.bbox.y0||a.bbox.x0-b.bbox.x0);

  // 行の高さ中央値
  const hs=ws.map(w=>w.bbox.y1-w.bbox.y0).sort((a,b)=>a-b);
  const medH=hs[Math.floor(hs.length/2)];
  const gap=medH*0.9;

  // Y座標でグループ化
  const lines=[];let cur=[ws[0]];let baseY=ws[0].bbox.y0;
  for(let i=1;i<ws.length;i++){
    if(ws[i].bbox.y0-baseY>gap){lines.push(cur);cur=[ws[i]];baseY=ws[i].bbox.y0;}
    else{cur.push(ws[i]);baseY=Math.max(baseY,ws[i].bbox.y0);}
  }
  lines.push(cur);
  lines.forEach(l=>l.sort((a,b)=>a.bbox.x0-b.bbox.x0));

  // 全単語のX開始位置をクラスタリングして列境界を決定
  const allX=lines.flatMap(l=>l.map(w=>w.bbox.x0));
  const colB=clusterX(allX,medH*1.5);

  if(colB.length<=1){
    // 列が1つ = 通常テキスト
    return lines.map(l=>l.map(w=>w.text).join(' ')).join('\n');
  }

  return lines.map(l=>{
    const cells=new Array(colB.length).fill('');
    for(const w of l){
      const ci=colB.reduce((best,b,i)=>Math.abs(w.bbox.x0-b)<Math.abs(w.bbox.x0-colB[best])?i:best,0);
      cells[ci]=(cells[ci]+' '+w.text).trim();
    }
    return cells.join('\t');
  }).join('\n');
}

function clusterX(xs,tol){
  const s=[...new Set(xs)].sort((a,b)=>a-b);
  if(!s.length) return[0];
  const clusters=[[s[0]]];
  for(let i=1;i<s.length;i++){
    const last=clusters[clusters.length-1];
    if(s[i]-last[last.length-1]<=tol) last.push(s[i]);
    else clusters.push([s[i]]);
  }
  return clusters.map(c=>c[Math.floor(c.length/2)]);
}

function loadSample(k){
  const titles={sales:'月別売上実績',kpi:'KPI ダッシュボード',compare:'部門別前年比較'};
  document.getElementById('raw-input').value=SAMPLES[k];
  document.getElementById('title-inp').value=titles[k];
  onTextChange();
}

async function downloadImage(){
  if(!allSections.length){showToast('データがありません');return;}
  showToast('画像生成中...');
  const canvas=await html2canvas(document.getElementById('table-container'),{scale:2,backgroundColor:null});
  const a=document.createElement('a');
  a.href=canvas.toDataURL('image/png');
  a.download=(document.getElementById('title-inp').value||'数表')+'.png';
  a.click();showToast('PNG保存しました ✓');
}
async function copyImage(){
  if(!allSections.length){showToast('データがありません');return;}
  try{
    showToast('クリップボードにコピー中...');
    const canvas=await html2canvas(document.getElementById('table-container'),{scale:2,backgroundColor:null});
    canvas.toBlob(async blob=>{
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      showToast('画像をコピーしました ✓');
    });
  }catch(err){showToast('コピー失敗（ブラウザ制限）');}
}
