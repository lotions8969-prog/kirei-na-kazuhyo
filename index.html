<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数表メーカー</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --border: #e2e8f0;
  --text: #1e293b;
  --muted: #64748b;
  --accent: #3b82f6;
  --accent2: #7c3aed;
  --header-bg: #1e293b;
  --header-text: #ffffff;
  --row-even: #f8fafc;
  --row-odd: #ffffff;
  --row-hover: #eff6ff;
  --num-pos: #1d4ed8;
  --num-neg: #dc2626;
  --heat-low: #eff6ff;
  --heat-high: #1e40af;
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
}

[data-theme="dark"] {
  --bg: #0f172a;
  --surface: #1e293b;
  --border: #334155;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --accent: #60a5fa;
  --accent2: #a78bfa;
  --header-bg: #0f172a;
  --header-text: #f1f5f9;
  --row-even: #1a2740;
  --row-odd: #1e293b;
  --row-hover: #1e3a5f;
  --num-pos: #60a5fa;
  --num-neg: #f87171;
  --heat-low: #1e293b;
  --heat-high: #3b82f6;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Hiragino Sans', 'Noto Sans JP', 'Segoe UI', sans-serif;
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}

/* ===== HEADER ===== */
.app-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
  position: sticky;
  top: 0;
  z-index: 100;
}

.app-title {
  font-size: 1.1rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 8px;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text);
  transition: all 0.2s;
  white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn-primary:hover { opacity: 0.9; color: #fff; }
.btn-ghost { border-color: transparent; }
.btn-ghost:hover { background: var(--row-hover); border-color: var(--border); color: var(--text); }

/* ===== LAYOUT ===== */
.layout {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 0;
  min-height: calc(100vh - 56px);
}

/* ===== SIDEBAR ===== */
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  overflow-y: auto;
  max-height: calc(100vh - 56px);
  position: sticky;
  top: 56px;
}

.section-label {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin-bottom: 8px;
}

/* ===== INPUT AREA ===== */
.input-area {
  border: 2px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
  background: var(--surface);
}
.input-area:focus-within,
.input-area.drag-over {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
}
.input-area-header {
  padding: 8px 12px;
  background: var(--row-even);
  border-bottom: 1px solid var(--border);
}
.input-area-hint {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--accent);
}
.data-input {
  width: 100%;
  min-height: 180px;
  padding: 12px;
  border: none;
  outline: none;
  background: var(--surface);
  color: var(--text);
  font-size: 0.82rem;
  font-family: 'Menlo', 'Consolas', monospace;
  resize: vertical;
  display: block;
}
.textarea-footer {
  padding: 6px 12px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--row-even);
}
.input-hint { font-size: 0.72rem; color: var(--muted); }

/* ===== SETTINGS ===== */
.settings-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.setting-label { font-size: 0.83rem; color: var(--text); flex: 1; }
.setting-label small { display: block; font-size: 0.72rem; color: var(--muted); }

select, input[type=text] {
  padding: 6px 10px;
  border-radius: 7px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 0.82rem;
  outline: none;
  transition: border-color 0.2s;
  cursor: pointer;
}
select:focus, input[type=text]:focus { border-color: var(--accent); }

/* toggle */
.toggle {
  position: relative;
  width: 38px;
  height: 22px;
  flex-shrink: 0;
}
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background: var(--border);
  border-radius: 999px;
  transition: 0.3s;
}
.toggle-slider::before {
  content: '';
  position: absolute;
  width: 16px; height: 16px;
  left: 3px; bottom: 3px;
  background: #fff;
  border-radius: 50%;
  transition: 0.3s;
}
.toggle input:checked + .toggle-slider { background: var(--accent); }
.toggle input:checked + .toggle-slider::before { transform: translateX(16px); }

/* color scheme chips */
.scheme-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.scheme-chip {
  border-radius: 8px;
  height: 40px;
  cursor: pointer;
  border: 2.5px solid transparent;
  transition: all 0.2s;
  overflow: hidden;
  display: flex;
}
.scheme-chip.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59,130,246,0.3); }
.scheme-chip div { flex: 1; }

/* ===== MAIN ===== */
.main {
  padding: 24px;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ===== TOOLBAR ===== */
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.toolbar-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }
.title-input {
  font-size: 1.1rem;
  font-weight: 700;
  border: none;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--text);
  outline: none;
  padding: 2px 4px;
  transition: border-color 0.2s;
  min-width: 200px;
}
.title-input:focus { border-color: var(--accent); }
.title-input::placeholder { color: var(--muted); font-weight: 400; }

/* ===== TABLE CONTAINER ===== */
#table-container {
  background: var(--surface);
  border-radius: 16px;
  box-shadow: var(--shadow);
  overflow: hidden;
  border: 1px solid var(--border);
}

.table-title-bar {
  padding: 16px 24px 12px;
  border-bottom: 1px solid var(--border);
}
.table-title {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text);
}
.table-subtitle {
  font-size: 0.78rem;
  color: var(--muted);
  margin-top: 3px;
}

.table-scroll { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
}

/* THEME: default blue */
.theme-blue thead tr { background: #1e3a5f; }
.theme-blue thead th { color: #bfdbfe; }
.theme-blue tbody tr:hover { background: #eff6ff !important; }
[data-theme="dark"] .theme-blue tbody tr:hover { background: #1e3a5f !important; }

/* THEME: slate */
.theme-slate thead tr { background: #334155; }
.theme-slate thead th { color: #e2e8f0; }
.theme-slate tbody tr:hover { background: #f1f5f9 !important; }
[data-theme="dark"] .theme-slate tbody tr:hover { background: #334155 !important; }

/* THEME: purple */
.theme-purple thead tr { background: #4c1d95; }
.theme-purple thead th { color: #ddd6fe; }
.theme-purple tbody tr:hover { background: #f5f3ff !important; }
[data-theme="dark"] .theme-purple tbody tr:hover { background: #2e1065 !important; }

/* THEME: green */
.theme-green thead tr { background: #14532d; }
.theme-green thead th { color: #bbf7d0; }
.theme-green tbody tr:hover { background: #f0fdf4 !important; }
[data-theme="dark"] .theme-green tbody tr:hover { background: #14532d !important; }

/* THEME: warm */
.theme-warm thead tr { background: #7c2d12; }
.theme-warm thead th { color: #fed7aa; }
.theme-warm tbody tr:hover { background: #fff7ed !important; }
[data-theme="dark"] .theme-warm tbody tr:hover { background: #7c2d12 !important; }

/* THEME: mono */
.theme-mono thead tr { background: #111827; }
.theme-mono thead th { color: #f9fafb; }
.theme-mono tbody tr:hover { background: #f9fafb !important; }
[data-theme="dark"] .theme-mono tbody tr:hover { background: #374151 !important; }

thead th {
  padding: 12px 16px;
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-align: left;
  white-space: nowrap;
  user-select: none;
  cursor: pointer;
}
thead th.num { text-align: right; }
thead th .sort-icon { opacity: 0.4; margin-left: 4px; }
thead th.sorted .sort-icon { opacity: 1; }

tbody td {
  padding: 10px 16px;
  font-size: 0.87rem;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  transition: background 0.1s;
}

tbody tr:last-child td { border-bottom: none; }
tbody tr:nth-child(even) { background: var(--row-even); }
tbody tr:nth-child(odd) { background: var(--row-odd); }

td.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
  font-family: 'Menlo','Consolas', monospace;
  color: var(--num-pos);
}
td.num.negative { color: var(--num-neg); }
td.num.zero { color: var(--muted); }

/* heat map overlay */
td.heat span.bar {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: rgba(59,130,246,0.12);
  z-index: 0;
  transition: width 0.3s;
}
td.heat {
  position: relative;
}
td.heat .cell-val { position: relative; z-index: 1; }

/* stripe for index */
td.row-idx {
  color: var(--muted);
  font-size: 0.75rem;
  font-variant-numeric: tabular-nums;
  text-align: right;
  padding-right: 8px;
  width: 40px;
  background: var(--row-even) !important;
  border-right: 1px solid var(--border);
}

/* footer summary */
.table-footer {
  padding: 10px 24px;
  border-top: 2px solid var(--border);
  background: var(--row-even);
  display: flex;
  gap: 24px;
  font-size: 0.78rem;
  color: var(--muted);
  flex-wrap: wrap;
}
.summary-item strong { color: var(--text); }

/* ===== EMPTY STATE ===== */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  color: var(--muted);
  text-align: center;
  gap: 12px;
}
.empty-icon { font-size: 3.5rem; opacity: 0.3; }
.empty-title { font-size: 1rem; font-weight: 600; }
.empty-hint { font-size: 0.83rem; line-height: 1.7; max-width: 320px; }

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #1e293b;
  color: #f1f5f9;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 0.85rem;
  font-weight: 600;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  transform: translateY(80px);
  opacity: 0;
  transition: all 0.3s;
  z-index: 999;
}
.toast.show { transform: translateY(0); opacity: 1; }

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { max-height: none; position: static; }
  .main { padding: 16px; }
}

/* ===== OCR OVERLAY ===== */
.ocr-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,10,26,0.75);
  z-index: 200;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
  backdrop-filter: blur(4px);
}
.ocr-overlay.show { display: flex; }
.ocr-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px 40px;
  text-align: center;
  min-width: 280px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.ocr-spinner {
  width: 40px; height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.ocr-title { font-weight: 700; color: var(--text); margin-bottom: 6px; }
.ocr-progress { font-size: 0.82rem; color: var(--muted); }
.ocr-bar-wrap { height: 4px; background: var(--border); border-radius: 9px; margin-top: 12px; overflow: hidden; }
.ocr-bar { height: 100%; background: var(--accent); border-radius: 9px; transition: width 0.3s; width: 0%; }

/* ===== PRINT ===== */
@media print {
  .app-header, .sidebar, .toolbar { display: none !important; }
  .main { padding: 0; }
  #table-container { box-shadow: none; border-radius: 0; }
}
</style>
</head>
<body>

<header class="app-header">
  <div class="app-title">📊 数表メーカー</div>
  <div class="header-actions">
    <button class="btn btn-ghost" onclick="toggleTheme()" id="theme-btn">🌙 ダーク</button>
    <button class="btn" onclick="printTable()">🖨 印刷</button>
    <button class="btn" onclick="copyImage()">📷 画像コピー</button>
    <button class="btn btn-primary" onclick="downloadImage()">⬇ PNG保存</button>
  </div>
</header>

<div class="layout">
  <!-- SIDEBAR -->
  <div class="sidebar">

    <div>
      <div class="section-label">データ入力</div>

      <div class="input-area" id="input-area">
        <div class="input-area-header">
          <span class="input-area-hint" id="input-area-hint">📋 ここにデータを貼り付け（Cmd+V / Ctrl+V）</span>
        </div>
        <textarea class="data-input" id="raw-input"
          placeholder="Excelやスプレッドシートからコピーして&#10;ここに貼り付けてください&#10;&#10;テキスト・CSV・TSV・スペース区切り・&#10;スクリーンショット画像 すべて対応"
          oninput="onInputChange()"
          onpaste="onRawPaste(event)"></textarea>
        <div class="textarea-footer">
          <span class="input-hint" id="parse-hint">データを貼り付けてください</span>
          <button class="btn btn-ghost" style="padding:3px 8px;font-size:0.72rem" onclick="clearData()">クリア</button>
        </div>
      </div>
    </div>

    <!-- SETTINGS -->
    <div>
      <div class="section-label">表のスタイル</div>
      <div class="settings-grid">

        <div>
          <div class="section-label" style="margin-bottom:6px">カラーテーマ</div>
          <div class="scheme-grid" id="scheme-grid">
            <div class="scheme-chip active" data-scheme="blue" onclick="setScheme('blue')" title="ブルー">
              <div style="background:#1e3a5f"></div><div style="background:#eff6ff"></div><div style="background:#bfdbfe"></div>
            </div>
            <div class="scheme-chip" data-scheme="slate" onclick="setScheme('slate')" title="スレート">
              <div style="background:#334155"></div><div style="background:#f1f5f9"></div><div style="background:#94a3b8"></div>
            </div>
            <div class="scheme-chip" data-scheme="purple" onclick="setScheme('purple')" title="パープル">
              <div style="background:#4c1d95"></div><div style="background:#f5f3ff"></div><div style="background:#ddd6fe"></div>
            </div>
            <div class="scheme-chip" data-scheme="green" onclick="setScheme('green')" title="グリーン">
              <div style="background:#14532d"></div><div style="background:#f0fdf4"></div><div style="background:#bbf7d0"></div>
            </div>
            <div class="scheme-chip" data-scheme="warm" onclick="setScheme('warm')" title="ウォーム">
              <div style="background:#7c2d12"></div><div style="background:#fff7ed"></div><div style="background:#fed7aa"></div>
            </div>
            <div class="scheme-chip" data-scheme="mono" onclick="setScheme('mono')" title="モノクロ">
              <div style="background:#111827"></div><div style="background:#f9fafb"></div><div style="background:#6b7280"></div>
            </div>
          </div>
        </div>

        <div class="setting-row">
          <label class="setting-label">行番号を表示</label>
          <label class="toggle">
            <input type="checkbox" id="tog-rownum" onchange="render()">
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="setting-row">
          <label class="setting-label">
            数値カラーバー
            <small>数値列に棒グラフ背景を表示</small>
          </label>
          <label class="toggle">
            <input type="checkbox" id="tog-heat" onchange="render()">
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="setting-row">
          <label class="setting-label">合計行を追加</label>
          <label class="toggle">
            <input type="checkbox" id="tog-total" onchange="render()">
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="setting-row">
          <label class="setting-label">サマリーを表示</label>
          <label class="toggle">
            <input type="checkbox" id="tog-summary" checked onchange="render()">
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="setting-row">
          <label class="setting-label">
            区切り文字
            <small>自動検出がうまくいかない時に変更</small>
          </label>
          <select id="delim-select" onchange="onInputChange()">
            <option value="auto">自動</option>
            <option value="tab">タブ</option>
            <option value="comma">カンマ</option>
            <option value="space">スペース</option>
            <option value="pipe">| パイプ</option>
            <option value="semi">; セミコロン</option>
          </select>
        </div>

        <div class="setting-row">
          <label class="setting-label">
            数値フォーマット
            <small>数値の桁区切り・小数点</small>
          </label>
          <select id="num-format" onchange="render()">
            <option value="auto">自動</option>
            <option value="comma">カンマ区切り</option>
            <option value="pct">%表示</option>
            <option value="raw">そのまま</option>
          </select>
        </div>

        <div class="setting-row">
          <label class="setting-label">サブタイトル</label>
          <input type="text" id="subtitle-input" placeholder="（任意）" style="width:160px" oninput="render()">
        </div>

      </div>
    </div>

    <!-- サンプル -->
    <div>
      <div class="section-label">サンプルデータ</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button class="btn" style="justify-content:flex-start" onclick="loadSample('sales')">📈 売上表（月別）</button>
        <button class="btn" style="justify-content:flex-start" onclick="loadSample('kpi')">📊 KPI一覧</button>
        <button class="btn" style="justify-content:flex-start" onclick="loadSample('compare')">🔄 前年比較</button>
      </div>
    </div>

  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="toolbar">
      <input class="title-input" id="title-input" placeholder="表のタイトルを入力..." oninput="render()" value="">
      <div class="toolbar-sep"></div>
      <button class="btn btn-ghost" id="sort-reset-btn" style="display:none" onclick="resetSort()">↺ ソート解除</button>
    </div>

    <div id="table-container">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">📋</div>
        <div class="empty-title">データを貼り付けてください</div>
        <div class="empty-hint">
          ExcelやGoogleスプレッドシートからコピーしたデータ、<br>
          CSVやTSV形式のテキストを左側に貼り付けると<br>
          レポート用の綺麗な表に変換します。
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="ocr-overlay" id="ocr-overlay">
  <div class="ocr-box">
    <div class="ocr-spinner"></div>
    <div class="ocr-title">画像を解析中...</div>
    <div class="ocr-progress" id="ocr-progress">テキストを認識しています</div>
    <div class="ocr-bar-wrap"><div class="ocr-bar" id="ocr-bar"></div></div>
  </div>
</div>

<script>
// ===== STATE =====
let parsedData = null;   // { headers: [], rows: [] }
let currentScheme = 'blue';
let sortCol = -1;
let sortAsc = true;
let colTypes = [];       // 'num' | 'text'

// ===== PARSE =====
function parseData(raw) {
  raw = raw.trim();
  if (!raw) return null;

  const lines = raw.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 1) return null;

  // ---- 区切り文字の決定 ----
  const manualDelim = document.getElementById('delim-select')
    ? document.getElementById('delim-select').value
    : 'auto';

  let splitFn;

  if (manualDelim !== 'auto') {
    // 手動指定
    const delimMap = { tab: '\t', comma: ',', space: /\s+/, pipe: '|', semi: ';' };
    const d = delimMap[manualDelim];
    splitFn = line => {
      const parts = typeof d === 'string'
        ? line.split(d)
        : line.trim().split(d);
      return parts.map(c => c.trim().replace(/^["']|["']$/g, ''));
    };
  } else {
    // 自動検出
    const medianColCount = arr => {
      const sorted = [...arr].sort((a,b)=>a-b);
      return sorted[Math.floor(sorted.length/2)];
    };

    const tabCounts   = lines.map(l => (l.match(/\t/g)||[]).length);
    const commaCounts = lines.map(l => (l.match(/,/g)||[]).length);
    const pipeCounts  = lines.map(l => (l.match(/\|/g)||[]).length);
    const semiCounts  = lines.map(l => (l.match(/;/g)||[]).length);
    const maxTab   = Math.max(...tabCounts);
    const maxComma = Math.max(...commaCounts);
    const maxPipe  = Math.max(...pipeCounts);
    const maxSemi  = Math.max(...semiCounts);

    if (maxTab > 0) {
      // TSV（Excelコピー等）
      splitFn = line => line.split('\t').map(c => c.trim().replace(/^["']|["']$/g, ''));
    } else if (maxComma > 0 && maxComma >= maxPipe && maxComma >= maxSemi) {
      // CSV（クォート対応）
      splitFn = line => {
        const result = []; let cur = ''; let inQ = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') { inQ = !inQ; continue; }
          if (ch === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
          else cur += ch;
        }
        result.push(cur.trim());
        return result;
      };
    } else if (maxPipe > 0 && maxPipe >= maxSemi) {
      splitFn = line => line.split('|').map(c => c.trim()).filter((c,i,a)=> !(i===0&&c==='') && !(i===a.length-1&&c===''));
    } else if (maxSemi > 0) {
      splitFn = line => line.split(';').map(c => c.trim());
    } else {
      // スペース区切り: まず2+スペースで試し、列数が安定しなければ1+スペースにフォールバック
      const trySplit = (lines, re) => lines.map(l => l.trim().split(re).map(c=>c.trim()).filter(c=>c!==''));
      const rows2  = trySplit(lines, /\s{2,}/);
      const rows1  = trySplit(lines, /\s+/);
      const med2   = medianColCount(rows2.map(r=>r.length));
      const med1   = medianColCount(rows1.map(r=>r.length));
      const dev2   = rows2.reduce((s,r)=>s+Math.abs(r.length-med2),0);
      const dev1   = rows1.reduce((s,r)=>s+Math.abs(r.length-med1),0);

      // 列数が1より多く、かつ列数のばらつきが小さい方を選ぶ
      let chosen;
      if (med2 > 1 && dev2 <= dev1) chosen = rows2;
      else if (med1 > 1) chosen = rows1;
      else chosen = rows1; // 最終フォールバック

      // splitFn は不要（行ごとに既に分割済みなので直接使う）
      const maxCols2 = Math.max(...chosen.map(r=>r.length));
      chosen.forEach(r => { while(r.length < maxCols2) r.push(''); });
      const headers = chosen[0];
      const dataRows = chosen.slice(1);
      colTypes = detectColTypes(headers, dataRows);
      return { headers, rows: dataRows };
    }
  }

  // splitFn が決まっている場合の共通処理
  const rows = lines.map(splitFn);
  const maxCols = Math.max(...rows.map(r => r.length));
  rows.forEach(r => { while(r.length < maxCols) r.push(''); });

  const headers  = rows[0];
  const dataRows = rows.slice(1);
  colTypes = detectColTypes(headers, dataRows);
  return { headers, rows: dataRows };
}

function detectColTypes(headers, dataRows) {
  return headers.map((_, ci) => {
    const vals = dataRows.map(r => r[ci]).filter(v => v !== '');
    if (!vals.length) return 'text';
    const numCount = vals.filter(v => {
      const c = v.replace(/,/g,'').replace(/%/,'').replace(/[+▲▼±]/g,'').trim();
      return c !== '' && !isNaN(parseFloat(c));
    }).length;
    return numCount / vals.length > 0.6 ? 'num' : 'text';
  });
}

function toNum(str) {
  if (!str) return null;
  const cleaned = str.replace(/,/g, '').replace('%', '');
  const n = parseFloat(cleaned);
  return isNaN(n) ? null : n;
}

// ===== FORMAT =====
function formatCell(val, colIdx) {
  if (colTypes[colIdx] !== 'num') return { display: val, raw: val, isNum: false };
  const fmt = document.getElementById('num-format').value;
  const n = toNum(val);
  if (n === null) return { display: val, raw: val, isNum: false };

  let display = val;
  if (fmt === 'comma' || (fmt === 'auto' && Math.abs(n) >= 1000)) {
    display = n.toLocaleString('ja-JP', { maximumFractionDigits: 4 });
  } else if (fmt === 'pct') {
    display = (n * 100).toFixed(1) + '%';
  } else {
    // auto: if original has comma treat as comma
    if (val.includes(',')) display = n.toLocaleString('ja-JP');
    else display = val;
  }
  return { display, raw: n, isNum: true };
}

// ===== RENDER =====
function render() {
  if (!parsedData) return;
  const { headers, rows } = parsedData;

  // sort
  let displayRows = [...rows];
  if (sortCol >= 0) {
    displayRows.sort((a, b) => {
      const av = colTypes[sortCol] === 'num' ? (toNum(a[sortCol]) ?? -Infinity) : a[sortCol];
      const bv = colTypes[sortCol] === 'num' ? (toNum(b[sortCol]) ?? -Infinity) : b[sortCol];
      if (av < bv) return sortAsc ? -1 : 1;
      if (av > bv) return sortAsc ? 1 : -1;
      return 0;
    });
  }

  // heat: per-col min/max for numeric
  const colMinMax = headers.map((_, ci) => {
    if (colTypes[ci] !== 'num') return null;
    const vals = rows.map(r => toNum(r[ci])).filter(v => v !== null);
    if (!vals.length) return null;
    return { min: Math.min(...vals), max: Math.max(...vals) };
  });

  // totals
  const totals = document.getElementById('tog-total').checked
    ? headers.map((_, ci) => {
        if (colTypes[ci] !== 'num') return null;
        const vals = rows.map(r => toNum(r[ci])).filter(v => v !== null);
        return vals.reduce((a,b) => a+b, 0);
      })
    : null;

  const showRowNum = document.getElementById('tog-rownum').checked;
  const showHeat = document.getElementById('tog-heat').checked;
  const showSummary = document.getElementById('tog-summary').checked;
  const title = document.getElementById('title-input').value;
  const subtitle = document.getElementById('subtitle-input').value;

  let html = '';

  // title bar
  if (title || subtitle) {
    html += `<div class="table-title-bar">
      ${title ? `<div class="table-title">${escHtml(title)}</div>` : ''}
      ${subtitle ? `<div class="table-subtitle">${escHtml(subtitle)}</div>` : ''}
    </div>`;
  }

  html += `<div class="table-scroll"><table class="theme-${currentScheme}">`;

  // thead
  html += '<thead><tr>';
  if (showRowNum) html += '<th></th>';
  headers.forEach((h, ci) => {
    const isNum = colTypes[ci] === 'num';
    const isSorted = sortCol === ci;
    const icon = isSorted ? (sortAsc ? '↑' : '↓') : '↕';
    html += `<th class="${isNum?'num':''} ${isSorted?'sorted':''}" onclick="doSort(${ci})">
      ${escHtml(h)} <span class="sort-icon">${icon}</span>
    </th>`;
  });
  html += '</tr></thead>';

  // tbody
  html += '<tbody>';
  displayRows.forEach((row, ri) => {
    html += '<tr>';
    if (showRowNum) html += `<td class="row-idx">${ri+1}</td>`;
    row.forEach((val, ci) => {
      const { display, raw, isNum } = formatCell(val, ci);
      let cls = isNum ? 'num' : '';
      if (isNum) {
        if (raw < 0) cls += ' negative';
        else if (raw === 0) cls += ' zero';
      }

      if (showHeat && isNum && colMinMax[ci]) {
        const { min, max } = colMinMax[ci];
        const pct = max !== min ? Math.round((raw - min) / (max - min) * 100) : 0;
        cls += ' heat';
        html += `<td class="${cls}"><span class="bar" style="width:${pct}%"></span><span class="cell-val">${escHtml(display)}</span></td>`;
      } else {
        html += `<td class="${cls}">${escHtml(display)}</td>`;
      }
    });
    html += '</tr>';
  });

  // total row
  if (totals) {
    html += '<tr style="font-weight:700;background:var(--row-even);border-top:2px solid var(--border)">';
    if (showRowNum) html += '<td class="row-idx">計</td>';
    totals.forEach((t, ci) => {
      if (t === null) {
        html += `<td style="color:var(--muted);font-size:0.8rem">合計</td>`;
      } else {
        const fmt = document.getElementById('num-format').value;
        let display;
        if (fmt === 'comma' || (fmt === 'auto' && Math.abs(t) >= 1000)) {
          display = t.toLocaleString('ja-JP', { maximumFractionDigits: 4 });
        } else {
          display = t.toString();
        }
        html += `<td class="num">${escHtml(display)}</td>`;
      }
    });
    html += '</tr>';
  }

  html += '</tbody></table></div>';

  // summary footer
  if (showSummary) {
    const numCols = colTypes.filter(t => t === 'num').length;
    const today = new Date().toLocaleDateString('ja-JP');
    html += `<div class="table-footer">
      <span><strong>${displayRows.length}</strong> 行 × <strong>${headers.length}</strong> 列</span>
      <span>数値列: <strong>${numCols}</strong></span>
      ${sortCol >= 0 ? `<span>ソート: <strong>${escHtml(headers[sortCol])}</strong> ${sortAsc?'昇順':'降順'}</span>` : ''}
      <span style="margin-left:auto">作成日: ${today}</span>
    </div>`;
  }

  const container = document.getElementById('table-container');
  container.innerHTML = html;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== SORT =====
function doSort(ci) {
  if (sortCol === ci) {
    if (sortAsc) { sortAsc = false; }
    else { sortCol = -1; sortAsc = true; }
  } else {
    sortCol = ci; sortAsc = true;
  }
  document.getElementById('sort-reset-btn').style.display = sortCol >= 0 ? '' : 'none';
  render();
}
function resetSort() {
  sortCol = -1; sortAsc = true;
  document.getElementById('sort-reset-btn').style.display = 'none';
  render();
}

// ===== INPUT =====
function onInputChange() {
  const raw = document.getElementById('raw-input').value;
  parsedData = parseData(raw);
  const hint = document.getElementById('parse-hint');
  const empty = document.getElementById('empty-state');

  if (!parsedData) {
    hint.textContent = 'データを貼り付けてください';
    if (empty) empty.style.display = '';
    return;
  }
  if (empty) empty.style.display = 'none';

  const { headers, rows } = parsedData;
  const numCols = colTypes.filter(t => t === 'num').length;
  hint.textContent = `${rows.length}行 × ${headers.length}列 を検出（数値列: ${numCols}）`;
  sortCol = -1; sortAsc = true;
  render();
}

function clearData() {
  document.getElementById('raw-input').value = '';
  parsedData = null;
  colTypes = [];
  sortCol = -1;
  document.getElementById('parse-hint').textContent = 'データを貼り付けてください';
  document.getElementById('sort-reset-btn').style.display = 'none';
  const container = document.getElementById('table-container');
  container.innerHTML = `<div class="empty-state" id="empty-state">
    <div class="empty-icon">📋</div>
    <div class="empty-title">データを貼り付けてください</div>
    <div class="empty-hint">ExcelやGoogleスプレッドシートからコピーしたデータ、<br>CSVやTSV形式のテキストを左側に貼り付けると<br>レポート用の綺麗な表に変換します。</div>
  </div>`;
}

// ===== SCHEME =====
function setScheme(s) {
  currentScheme = s;
  document.querySelectorAll('.scheme-chip').forEach(el => {
    el.classList.toggle('active', el.dataset.scheme === s);
  });
  render();
}

// ===== THEME =====
function toggleTheme() {
  const isDark = document.body.getAttribute('data-theme') === 'dark';
  document.body.setAttribute('data-theme', isDark ? '' : 'dark');
  document.getElementById('theme-btn').textContent = isDark ? '🌙 ダーク' : '☀ ライト';
}

// ===== EXPORT =====
function printTable() { window.print(); }

async function downloadImage() {
  const el = document.getElementById('table-container');
  if (!parsedData) { showToast('データがありません'); return; }
  showToast('画像を生成中...');
  const canvas = await html2canvas(el, { scale: 2, backgroundColor: null });
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = (document.getElementById('title-input').value || '数表') + '.png';
  a.click();
  showToast('PNG保存しました ✓');
}

async function copyImage() {
  const el = document.getElementById('table-container');
  if (!parsedData) { showToast('データがありません'); return; }
  try {
    showToast('クリップボードにコピー中...');
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: null });
    canvas.toBlob(async blob => {
      await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
      showToast('画像をコピーしました ✓');
    });
  } catch(e) {
    showToast('コピー失敗（ブラウザ制限）');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== DRAG & DROP (input-area) =====
const inputArea = document.getElementById('input-area');
const rawInput  = document.getElementById('raw-input');

inputArea.addEventListener('dragover', e => { e.preventDefault(); inputArea.classList.add('drag-over'); });
inputArea.addEventListener('dragleave', () => inputArea.classList.remove('drag-over'));
inputArea.addEventListener('drop', async e => {
  e.preventDefault();
  inputArea.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (!file) return;
  if (file.type.startsWith('image/')) {
    await ocrImage(file);
  } else {
    const reader = new FileReader();
    reader.onload = ev => { rawInput.value = ev.target.result; onInputChange(); };
    reader.readAsText(file, 'UTF-8');
  }
});

// テキストエリア内のペーストハンドラ（画像も検出）
async function onRawPaste(e) {
  const items = Array.from(e.clipboardData.items);
  const imageItem = items.find(it => it.type.startsWith('image/'));
  if (imageItem) {
    e.preventDefault();
    await ocrImage(imageItem.getAsFile());
    return;
  }
  // テキストはブラウザのデフォルト動作に任せ、少し待ってから解析
  setTimeout(onInputChange, 50);
}

// ページのどこでも貼り付け可能にする（テキストエリア以外）
document.addEventListener('paste', async e => {
  const target = e.target;
  const ta = document.getElementById('raw-input');

  const items = Array.from(e.clipboardData.items);
  const imageItem = items.find(it => it.type.startsWith('image/'));

  if (imageItem) {
    e.preventDefault();
    await ocrImage(imageItem.getAsFile());
    return;
  }

  // テキストエリアや入力欄にフォーカスがある場合はそちらで処理済み
  if (target === ta || target.tagName === 'INPUT') return;

  const text = e.clipboardData.getData('text/plain');
  if (!text) return;
  e.preventDefault();
  ta.value = text;
  ta.focus();
  onInputChange();
  showToast('データを貼り付けました ✓');
});

// ===== OCR =====
async function ocrImage(blob) {
  const overlay = document.getElementById('ocr-overlay');
  const progressEl = document.getElementById('ocr-progress');
  const barEl = document.getElementById('ocr-bar');
  overlay.classList.add('show');

  try {
    const worker = await Tesseract.createWorker('jpn+eng', 1, {
      logger: m => {
        if (m.status === 'recognizing text') {
          const pct = Math.round((m.progress || 0) * 100);
          barEl.style.width = pct + '%';
          progressEl.textContent = `テキスト認識中... ${pct}%`;
        } else {
          progressEl.textContent = m.status;
        }
      }
    });

    const { data: { text } } = await worker.recognize(blob);
    await worker.terminate();

    // OCR結果をテキストエリアに流し込む
    const cleaned = cleanOcrText(text);
    const ta = document.getElementById('raw-input');
    ta.value = cleaned;
    onInputChange();
    showToast('画像のOCR完了 ✓');
  } catch(err) {
    console.error(err);
    showToast('OCR失敗: ' + err.message);
  } finally {
    overlay.classList.remove('show');
  }
}

function cleanOcrText(raw) {
  return raw
    .split(/\r?\n/)
    .map(l => l
      // 全角スペース→半角
      .replace(/　/g, ' ')
      // OCR由来の縦棒（表の罫線）を除去
      .replace(/[|｜]/g, '\t')
      // 連続スペース正規化（先頭・末尾除く）
      .trim()
    )
    .filter(l => l.length > 0)
    .join('\n');
}
